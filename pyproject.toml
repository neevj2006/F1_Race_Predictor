[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "f1-race-predictor"
version = "0.1.0"
description = "Chronological Formula 1 race-order modeling tools"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastf1==3.8.3",
  "joblib==1.5.3",
  "numpy==2.5.2",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
f1-ingest = "f1_race_predictor.ingestion:main"
f1-normalize = "f1_race_predictor.normalization:main"
f1-features = "f1_race_predictor.features:main"
f1-evaluate = "f1_race_predictor.evaluation:main"
f1-train = "f1_race_predictor.training:main"
f1-predict = "f1_race_predictor.prediction:main"
f1-register-model = "f1_race_predictor.registry:main"
f1-archive-prediction = "f1_race_predictor.archive:archive_main"
f1-evaluate-prediction = "f1_race_predictor.archive:evaluate_main"
f1-reproduce-prediction = "f1_race_predictor.archive:reproduce_main"
f1-check = "f1_race_predictor.checks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_race_predictor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src/f1_race_predictor", "tests"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
